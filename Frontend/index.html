<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Stress Predictor 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2b5c8f;
            --academic: #3498db; --physio: #2ecc71;
            --psycho: #9b59b6; --social: #e67e22;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: #f0f2f5;
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; overflow: hidden;
        }

        .scene { width: 500px; height: 680px; perspective: 1500px; }
        
        .card-container { 
            width: 100%; height: 100%; position: relative; 
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); 
            transform-style: preserve-3d; 
        }
        .card-container.is-flipped { transform: rotateY(180deg); }
        
        .card-face { 
            position: absolute; width: 100%; height: 100%; 
            background: white; padding: 40px; border-radius: 30px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            backface-visibility: hidden; 
            display: flex; flex-direction: column; box-sizing: border-box;
            border: 2px solid rgba(0,0,0,0.05);
        }
        
        .card-face-back { transform: rotateY(180deg); }

        h2 { font-family: 'Fredoka One', cursive; font-size: 28px; color: var(--primary); margin-bottom: 5px; text-align:center; }
        .quote { font-style: italic; color: #777; margin-bottom: 30px; font-size: 14px; border-left: 3px solid #ddd; padding-left: 10px; min-height: 40px;}
        
        .input-group { margin-top: 20px; text-align: left; }
        label { font-size: 18px; color: #333; font-weight: 600; display: block; margin-bottom: 15px; min-height: 55px;}
        
        .slider-wrapper { display: flex; align-items: center; gap: 20px; }
        input[type="range"] { flex-grow: 1; height: 10px; cursor: pointer; accent-color: var(--primary); }
        .range-value { 
            min-width: 45px; height: 45px; background: var(--primary); color: white;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px; font-size: 20px; font-weight: bold;
        }

        .btn-group { display: flex; gap: 15px; margin-top: auto; padding-top: 20px; }
        button { padding: 18px; border-radius: 15px; cursor: pointer; font-size: 18px; font-weight: 600; transition: 0.3s; border: none; flex: 1; }
        .next-btn { background: var(--primary); color: white; }

        /* GAUGE STYLES */
        .gauge-outer { position: relative; width: 240px; height: 120px; margin: 20px auto 40px; overflow: visible; }
        .gauge-bg { position: absolute; width: 240px; height: 240px; border-radius: 50%; background: conic-gradient(from 270deg, #8BC34A 0 60deg, #FFC107 60deg 120deg, #E53935 120deg 180deg, transparent 180deg 360deg); }
        .gauge-inner { position: absolute; width: 180px; height: 180px; background: white; border-radius: 50%; top: 30px; left: 30px; }
        .needle { position: absolute; bottom: 0; left: 50%; width: 4px; height: 100px; background: #333; transform-origin: bottom center; transform: rotate(-90deg); transition: 2s cubic-bezier(0.17, 0.67, 0.83, 0.67); border-radius: 4px; z-index: 5; }
        .percent-tag { position: absolute; font-size: 11px; font-weight: bold; color: #777; width: 35px; text-align: center; }

        .res-pill { padding: 15px; margin: 8px 0; border-radius: 15px; font-weight: bold; opacity: 0.2; background: #f8f9fa; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .res-pill.active { opacity: 1; transform: scale(1.05); background: white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 1px solid #eee; }
    </style>
</head>
<body>

<div class="scene">
    <div class="card-container" id="flipper">
        <div class="card-face" id="face-front">
            <div id="progress-txt" style="font-weight: bold; color: #bbb;">Step 1 / 10</div>
            <h2 id="title-f">Loading...</h2>
            <p class="quote" id="quote-f">Wait a moment...</p>
            
            <div class="input-group">
                <label id="label-f">Question Loading...</label>
                <div class="slider-wrapper">
                    <input type="range" min="1" max="10" value="5" id="slider-f" oninput="updateDisp('f')">
                    <div class="range-value" id="val-f">5</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="next-btn" onclick="flipToBack()">Flip & Next &rarr;</button>
            </div>
        </div>

        <div class="card-face card-face-back" id="face-back">
            <div id="back-step-txt" style="font-weight: bold; color: #bbb;">Step 1 / 10</div>
            <h2 id="title-b">Loading...</h2>
            <p class="quote" id="quote-b">Almost there...</p>
            
            <div id="back-content-area">
                <div class="input-group">
                    <label id="label-b">Question Loading...</label>
                    <div class="slider-wrapper">
                        <input type="range" min="1" max="10" value="5" id="slider-b" oninput="updateDisp('b')">
                        <div class="range-value" id="val-b">5</div>
                    </div>
                </div>
            </div>

            <div class="btn-group" id="back-btn-group">
                <button class="next-btn" onclick="flipToFront()" id="action-btn">Next Card &rarr;</button>
            </div>
        </div>
    </div>
</div>

<script>
    const allQuestions = [
        // ACADEMIC (1-5)
        { title: "Study Load", label: "Rate your daily study load (Hours/Volume)", quote: "Kitabein bohot si... par neend bhi zaroori hai!", color: "#3498db" },
        { title: "Grades", label: "How satisfied are you with your grades?", quote: "Result toh ek paper hai, aap gold ho!", color: "#3498db" },
        { title: "Attendance", label: "Rate your regularity in classes (%)", quote: "Attendance 75%? Mushkil hai par namumkin nahi.", color: "#3498db" },
        { title: "Career", label: "Future career concern level?", quote: "Life set hai? Ya abhi tension baaki hai?", color: "#3498db" },
        { title: "Teachers", label: "Teacher-Student relationship quality?", quote: "Teacher strict hain ya dost jaise?", color: "#3498db" },
        
        // PHYSIOLOGICAL (6-10)
        { title: "Sleep", label: "Quality of your sleep lately?", quote: "8 ghante ki neend = 80% stress khatam.", color: "#2ecc71" },
        { title: "Headache", label: "Frequency of headaches or migraines?", quote: "Sar dard hai ya sirf Monday blues?", color: "#2ecc71" },
        { title: "Activity", label: "Physical activity/Sports involvement?", quote: "Body hilaao, stress bhagaao!", color: "#2ecc71" },
        { title: "Breathing", label: "Any breathing issues or panic signs?", quote: "Gehri saans lo... sab theek ho jayega.", color: "#2ecc71" },
        { title: "Diet", label: "Eating habits (Healthy vs Junk)?", quote: "Pizza khushi deta hai, par salad shanti.", color: "#2ecc71" },

        // PSYCHOLOGICAL (11-15)
        { title: "Anxiety", label: "Daily anxiety or nervousness level?", quote: "Chill maro, duniya nahi khatam ho rahi.", color: "#9b59b6" },
        { title: "Mood", label: "Frequency of mood swings?", quote: "Kabhi khushi kabhi gham... normal hai!", color: "#9b59b6" },
        { title: "Self Esteem", label: "How confident do you feel in yourself?", quote: "Aap apna favourite ho, bas yaad rakho.", color: "#9b59b6" },
        { title: "Focus", label: "Concentration and focus on tasks?", quote: "Ek waqt pe ek kaam, baaki sab jaam.", color: "#9b59b6" },
        { title: "Happiness", label: "Overall happiness with current life?", quote: "Smile please! Mobile ka front camera dekho.", color: "#9b59b6" },

        // SOCIETAL (16-20)
        { title: "Peer Pressure", label: "Pressure to fit in with friends?", quote: "Log kya kahenge? Kuch toh log kahenge!", color: "#e67e22" },
        { title: "Family", label: "Support from family/home environment?", quote: "Family is everything, unse baat toh karo.", color: "#e67e22" },
        { title: "Safety", label: "How safe do you feel in your surroundings?", quote: "Safety first! Mental aur physical dono.", color: "#e67e22" },
        { title: "Socializing", label: "Time spent socializing with others?", quote: "Dost banao, chai piyo, stress bhulao.", color: "#e67e22" },
        { title: "Internet", label: "Internet/Social media usage impact?", quote: "Screen time kam, real life zyada!", color: "#e67e22" }
    ];

    let currentCardIndex = 0; 
    const answers = new Array(20).fill(5);

    function updateDisp(side) {
        const val = document.getElementById(`slider-${side}`).value;
        document.getElementById(`val-${side}`).innerText = val;
    }

    function flipToBack() {
        answers[currentCardIndex * 2] = document.getElementById('slider-f').value;
        document.getElementById('flipper').classList.add('is-flipped');
    }

    function flipToFront() {
        answers[currentCardIndex * 2 + 1] = document.getElementById('slider-b').value;
        
        if (currentCardIndex < 9) {
            currentCardIndex++;
            loadCardData();
            document.getElementById('flipper').classList.remove('is-flipped');
        } else {
            predictFinal();
        }
    }

    function loadCardData() {
        const qF = allQuestions[currentCardIndex * 2];
        const qB = allQuestions[currentCardIndex * 2 + 1];

        // Front Side Update
        document.getElementById('progress-txt').innerText = `Step ${currentCardIndex * 2 + 1} / 20`;
        document.getElementById('title-f').innerText = qF.title;
        document.getElementById('label-f').innerText = qF.label;
        document.getElementById('quote-f').innerText = qF.quote;
        document.getElementById('slider-f').value = answers[currentCardIndex * 2];
        document.getElementById('val-f').innerText = answers[currentCardIndex * 2];
        document.getElementById('face-front').style.borderTop = `10px solid ${qF.color}`;

        // Back Side Update
        document.getElementById('back-step-txt').innerText = `Step ${currentCardIndex * 2 + 2} / 20`;
        document.getElementById('title-b').innerText = qB.title;
        document.getElementById('label-b').innerText = qB.label;
        document.getElementById('quote-b').innerText = qB.quote;
        document.getElementById('slider-b').value = answers[currentCardIndex * 2 + 1];
        document.getElementById('val-b').innerText = answers[currentCardIndex * 2 + 1];
        document.getElementById('face-back').style.borderTop = `10px solid ${qB.color}`;
        
        document.getElementById('action-btn').innerText = (currentCardIndex === 9) ? "See Final Result 🎯" : "Next Card ➔";
    }

    async function predictFinal() {
        document.getElementById('back-step-txt').innerText = "Processing...";
        document.getElementById('title-b').innerText = "Analyzing Results";
        document.getElementById('back-content-area').innerHTML = "<div style='text-align:center; padding:50px;'>Calculating your score...</div>";
        document.getElementById('back-btn-group').style.display = "none";

        try {
            const res = await fetch("https://student-stress-predictor-y4y5.onrender.com/predict", {
                method: "POST", headers: {"Content-Type": "application/json"},
                body: JSON.stringify({features: answers.map(Number)})
            });
            const data = await res.json();
            showFinalUI(data.stress_level);
        } catch(e) {
            alert("Error connecting to server!");
            location.reload();
        }
    }

    function showFinalUI(lvl) {
        document.getElementById('back-step-txt').innerText = "Final Report";
        document.getElementById('title-b').innerText = "Result";
        document.getElementById('quote-b').innerText = "Here is your stress analysis.";
        
        document.getElementById('back-content-area').innerHTML = `
            <div class="gauge-outer">
                <div class="gauge-bg"></div>
                <div class="gauge-inner"></div>
                <div class="needle" id="res-needle"></div>
                <div style="position: absolute; width: 100%; top: 0; left: 0;">
                    <span class="percent-tag" style="left: -15px; bottom: -120px;">0%</span>
                    <span class="percent-tag" style="left: 0px; top: 20px;">25%</span>
                    <span class="percent-tag" style="left: 105px; top: -15px;">50%</span>
                    <span class="percent-tag" style="right: 0px; top: 20px;">75%</span>
                    <span class="percent-tag" style="right: -15px; bottom: -120px;">100%</span>
                </div>
            </div>
            <div class="res-pill ${lvl==='Low'?'active':''}" style="color:#2ecc71">😊 Low Stress</div>
            <div class="res-pill ${lvl.includes('Med')||lvl.includes('Mod')?'active':''}" style="color:#f1c40f">😐 Moderate Stress</div>
            <div class="res-pill ${lvl==='High'?'active':''}" style="color:#e74c3c">😟 High Stress</div>
            <button onclick="location.reload()" class="next-btn" style="margin-top:20px; width:100%">Restart Test</button>
        `;

        setTimeout(() => {
            const needle = document.getElementById('res-needle');
            if(lvl === "Low") needle.style.transform = "rotate(-60deg)";
            else if(lvl.includes("Med") || lvl.includes("Mod")) needle.style.transform = "rotate(0deg)";
            else needle.style.transform = "rotate(60deg)";
        }, 500);
    }

    window.onload = loadCardData;
</script>
</body>
</html>
