<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Stress Predictor with Gauge</title>
    <style>
        :root {
            --primary: #2b5c8f;
            --academic: #3498db;
            --physio: #2ecc71;
            --psycho: #9b59b6;
            --social: #e67e22;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; overflow: hidden;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .scene { width: 450px; height: 580px; perspective: 1200px; animation: float 4s ease-in-out infinite; }
        
        .card-container { 
            width: 100%; height: 100%; position: relative; 
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); 
            transform-style: preserve-3d; 
        }
        .card-container.flip { transform: rotateY(180deg); }
        
        .card { 
            position: absolute; width: 100%; height: 100%; 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            padding: 30px; border-radius: 25px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
            backface-visibility: hidden; 
            display: flex; flex-direction: column; box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.3);
        }
        
        .card.back { transform: rotateY(180deg); justify-content: center; text-align: center;}

        .academic-theme { border-top: 10px solid var(--academic); }
        .physio-theme { border-top: 10px solid var(--physio); }
        .psycho-theme { border-top: 10px solid var(--psycho); }
        .social-theme { border-top: 10px solid var(--social); }

        h2 { margin: 0 0 15px; font-size: 24px; text-align: center; color: #333; }
        .step-info { text-align: center; font-weight: bold; color: #888; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; font-size: 12px;}

        .input-group { margin-bottom: 25px; }
        label { font-size: 14px; color: #444; font-weight: 500; display: block; margin-bottom: 10px; text-align: left;}
        
        .slider-wrapper { display: flex; align-items: center; gap: 15px; }
        input[type="range"] { flex-grow: 1; cursor: pointer; accent-color: var(--primary); }
        .range-value { 
            min-width: 35px; height: 35px; background: var(--primary); color: white;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 14px; font-weight: bold;
        }

        .btn-group { display: flex; gap: 15px; margin-top: auto; }
        button { padding: 15px; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; transition: 0.3s; border: none; }
        .next-btn { background: var(--primary); color: white; flex-grow: 2; }
        .prev-btn { background: #eee; color: #666; flex-grow: 1; }

        /* GAUGE WITH PERCENTAGE MARKERS */
        .gauge-outer { position: relative; width: 240px; height: 120px; margin: 0 auto 40px; overflow: visible; }
        .gauge-bg { position: absolute; width: 240px; height: 240px; border-radius: 50%; background: conic-gradient(from 270deg, #8BC34A 0 60deg, #FFC107 60deg 120deg, #E53935 120deg 180deg, transparent 180deg 360deg); }
        .gauge-inner { position: absolute; width: 180px; height: 180px; background: white; border-radius: 50%; top: 30px; left: 30px; }
        .needle { position: absolute; bottom: 0; left: 50%; width: 4px; height: 100px; background: #333; transform-origin: bottom center; transform: rotate(-90deg); transition: 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67); border-radius: 4px; z-index: 5; }
        
        /* Percentage Labels Around the Curve */
        .gauge-labels { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        .percent-tag {
            position: absolute; font-size: 10px; font-weight: bold; color: #777;
            width: 30px; text-align: center;
        }

        .result-box { opacity: 0.3; transition: 0.5s; margin: 8px 0; padding: 12px; border-radius: 10px; background: #f8f9fa; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold;}
        .result-box.active { opacity: 1; transform: scale(1.05); background: white; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 1px solid #ddd;}
    </style>
</head>
<body>

<div class="scene">
    <div class="card-container" id="flipper">
        
        <div class="card front academic-theme" id="main-card">
            <div class="step-info" id="step-txt">Step 1 of 5</div>
            <h2 id="title-txt">Academic Load</h2>
            <div id="questions-area"></div>
            <div class="btn-group">
                <button class="prev-btn" id="back-btn" onclick="goBack()" style="visibility: hidden;">Back</button>
                <button class="next-btn" onclick="goNext()" id="action-btn">Next Step</button>
            </div>
        </div>

        <div class="card back">
            <h2>Analysis Result</h2>
            <div class="gauge-outer">
                <div class="gauge-bg"></div>
                <div class="gauge-inner"></div>
                <div class="needle" id="needle"></div>
                
                <div class="gauge-labels">
                    <span class="percent-tag" style="left: -15px; bottom: 0;">0%</span>
                    <span class="percent-tag" style="left: 0px; top: 20px;">25%</span>
                    <span class="percent-tag" style="left: 105px; top: -15px;">50%</span>
                    <span class="percent-tag" style="right: 0px; top: 20px;">75%</span>
                    <span class="percent-tag" style="right: -15px; bottom: 0;">100%</span>
                </div>
            </div>

            <div class="result-box" id="res-low">😊 Low Stress</div>
            <div class="result-box" id="res-med">😐 Moderate Stress</div>
            <div class="result-box" id="res-high">😟 High Stress</div>

            <button class="next-btn" style="margin-top: 25px; width: 100%;" onclick="location.reload()">Restart Test</button>
        </div>

    </div>
</div>

<script>
    const questions = [
        { id: "study_load", label: "Rate your Study Load", theme: "academic-theme" },
        { id: "academic_perf", label: "Academic Performance Score", theme: "academic-theme" },
        { id: "attendance", label: "Regularity in Attendance", theme: "academic-theme" },
        { id: "career_concern", label: "Future Career Concern", theme: "academic-theme" },
        { id: "sleep_quality", label: "Sleep Quality & Rest", theme: "physio-theme" },
        { id: "physical_act", label: "Physical Activity Level", theme: "physio-theme" },
        { id: "anxiety", label: "Anxiety & Nervousness", theme: "psycho-theme" },
        { id: "self_esteem", label: "Self Confidence Level", theme: "psycho-theme" },
        { id: "peer_pressure", label: "Social/Peer Pressure", theme: "social-theme" },
        { id: "family_rel", label: "Family Support/Relationship", theme: "social-theme" }
    ];

    let currentPair = 0;
    const answers = {};

    function updateCard() {
        const card = document.getElementById('main-card');
        const qArea = document.getElementById('questions-area');
        const q1 = questions[currentPair * 2];
        const q2 = questions[currentPair * 2 + 1];

        card.className = `card front ${q1.theme}`;
        const themeColor = getComputedStyle(document.body).getPropertyValue(`--${q1.theme.split('-')[0]}`);
        document.documentElement.style.setProperty('--primary', themeColor);

        document.getElementById('step-txt').innerText = `Step ${currentPair + 1} of 5`;
        document.getElementById('title-txt').innerText = q1.theme.split('-')[0].toUpperCase();

        qArea.innerHTML = renderSlider(q1) + renderSlider(q2);

        document.getElementById('back-btn').style.visibility = currentPair === 0 ? 'hidden' : 'visible';
        document.getElementById('action-btn').innerText = currentPair === 4 ? "Get Results" : "Next Step";
    }

    function renderSlider(q) {
        const val = answers[q.id] || 5;
        return `
            <div class="input-group">
                <label>${q.label}</label>
                <div class="slider-wrapper">
                    <input type="range" min="1" max="10" value="${val}" id="${q.id}" oninput="updateVal('${q.id}', this.value)">
                    <div class="range-value" id="val-${q.id}">${val}</div>
                </div>
            </div>`;
    }

    function updateVal(id, val) {
        document.getElementById(`val-${id}`).innerText = val;
        answers[id] = val;
    }

    function goNext() {
        const q1 = questions[currentPair * 2];
        const q2 = questions[currentPair * 2 + 1];
        answers[q1.id] = document.getElementById(q1.id).value;
        answers[q2.id] = document.getElementById(q2.id).value;

        if (currentPair < 4) {
            currentPair++;
            updateCard();
        } else {
            submitData();
        }
    }

    function goBack() {
        if (currentPair > 0) {
            currentPair--;
            updateCard();
        }
    }

    async function submitData() {
        document.getElementById('action-btn').innerText = "Analyzing...";
        const features = questions.map(q => parseFloat(answers[q.id] || 5));
        while(features.length < 20) features.push(5); 

        try {
            const res = await fetch("https://student-stress-predictor-y4y5.onrender.com/predict", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({features})
            });
            const data = await res.json();
            document.getElementById('flipper').classList.add('flip');
            showResult(data.stress_level);
        } catch(e) {
            alert("Connection Error!");
        }
    }

    function showResult(lvl) {
        const needle = document.getElementById('needle');
        document.querySelectorAll('.result-box').forEach(b => b.classList.remove('active'));
        
        if(lvl === "Low") {
            needle.style.transform = "rotate(-60deg)";
            document.getElementById('res-low').classList.add('active');
        } else if(lvl.includes("Med") || lvl.includes("Mod")) {
            needle.style.transform = "rotate(0deg)";
            document.getElementById('res-med').classList.add('active');
        } else {
            needle.style.transform = "rotate(60deg)";
            document.getElementById('res-high').classList.add('active');
        }
    }

    updateCard();
</script>
</body>
</html>
