<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stress Level Predictor</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; margin-bottom: 20px; }
        
        /* Input Form Styles */
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #2b5c8f; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #1a3d60; }

        /* Gauge Meter Styles */
        .gauge-box { margin-top: 30px; display: none; } /* Hidden by default */
        .gauge-container { position: relative; width: 200px; height: 100px; overflow: hidden; margin: 0 auto; }
        .gauge-bg { position: absolute; width: 200px; height: 200px; border-radius: 50%; background: conic-gradient(from 270deg, #8BC34A 0 60deg, #FFC107 60deg 120deg, #E53935 120deg 180deg, transparent 180deg 360deg); }
        .gauge-inner { position: absolute; width: 140px; height: 140px; background: white; border-radius: 50%; top: 30px; left: 30px; }
        .needle { position: absolute; bottom: 0; left: 50%; width: 4px; height: 80px; background: #333; transform-origin: bottom center; transform: rotate(0deg); transition: transform 1s ease-in-out; border-radius: 4px; }
        .needle::after { content: ''; position: absolute; bottom: -6px; left: -6px; width: 16px; height: 16px; background: #333; border-radius: 50%; }

        /* Result Display Styles */
        .result-display { margin-top: 20px; border: 2px solid #2b5c8f; border-radius: 8px; padding: 15px; }
        .emoji-row { display: flex; align-items: center; justify-content: center; margin: 10px 0; opacity: 0.3; transition: opacity 0.5s; font-size: 20px; font-weight: bold; }
        .emoji-row.active { opacity: 1; transform: scale(1.1); }
        .emoji-row span { margin-left: 10px; }
        .low-text { color: #8BC34A; }
        .mod-text { color: #FFB300; }
        .high-text { color: #E53935; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Stress Level Predictor</h2>
        <p>Enter your details below:</p>
        
        <input type="number" id="study_hours" placeholder="Study Load (e.g. 5)">
        <input type="number" id="sleep_hours" placeholder="Sleep Quality (e.g. 7)">
        <button onclick="predictStress()">Predict Stress Level</button>
    </div>

    <div class="card gauge-box" id="output-section">
        <h3>Stress Level Prediction</h3>
        
        <div class="gauge-container">
            <div class="gauge-bg"></div>
            <div class="gauge-inner"></div>
            <div class="needle" id="gauge-needle" style="transform: rotate(-90deg);"></div> 
        </div>

        <div class="result-display">
            <div class="emoji-row" id="result-low">
                <span style="font-size: 30px;">😊</span>
                <span class="low-text">Low Stress</span>
            </div>
            <div class="emoji-row" id="result-medium">
                <span style="font-size: 30px;">😐</span>
                <span class="mod-text">Moderate Stress</span>
            </div>
            <div class="emoji-row" id="result-high">
                <span style="font-size: 30px;">😟</span>
                <span class="high-text">High Stress</span>
            </div>
        </div>
    </div>

    <script>
        async function predictStress() {
            // 1. Get values from inputs
            const study = parseFloat(document.getElementById('study_hours').value);
            const sleep = parseFloat(document.getElementById('sleep_hours').value);
            
            // Ye array aapke dataset ke columns se match hona chahiye
            const userFeatures = [study, sleep]; // Add other features here

            // Show output section
            document.getElementById('output-section').style.display = 'block';

            try {
                // Apna Render URL yahan daalein
                const response = await fetch("https://YOUR-RENDER-APP-NAME.onrender.com/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ features: userFeatures })
                });

                const data = await response.json();
                updateUI(data.stress_level);

            } catch (error) {
                console.error("API Error:", error);
                // For testing UI without API, you can hardcode a result here temporarily:
                // updateUI("Medium"); 
            }
        }

        function updateUI(level) {
            const needle = document.getElementById('gauge-needle');
            const rowLow = document.getElementById('result-low');
            const rowMed = document.getElementById('result-medium');
            const rowHigh = document.getElementById('result-high');

            // Reset classes
            rowLow.classList.remove('active');
            rowMed.classList.remove('active');
            rowHigh.classList.remove('active');

            // Update UI based on API response
            if (level === "Low") {
                needle.style.transform = "rotate(-60deg)"; // Left area
                rowLow.classList.add('active');
            } else if (level === "Medium" || level === "Moderate") {
                needle.style.transform = "rotate(0deg)"; // Middle area
                rowMed.classList.add('active');
            } else if (level === "High") {
                needle.style.transform = "rotate(60deg)"; // Right area
                rowHigh.classList.add('active');
            }
        }
    </script>

</body>
</html>
